name: CI

on:
    pull_request:
        branches:
            - dev
            - master
    push:
        branches:
            - dev
            - master

permissions:
    contents: read

jobs:
    quality:
        name: quality
        runs-on: ubuntu-latest
        timeout-minutes: 15

        steps:
            - name: Checkout
              uses: actions/checkout@v5

            - name: Set up pnpm
              uses: pnpm/action-setup@v4
              with:
                  version: 11.9.0

            - name: Set up Node.js
              uses: actions/setup-node@v5
              with:
                  node-version: 22.13.0
                  cache: pnpm

            - name: Install dependencies
              run: pnpm install --frozen-lockfile

            - name: Install Playwright browser
              run: pnpm exec playwright install --with-deps chromium

            - name: Lint
              run: pnpm lint

            - name: Typecheck
              run: pnpm typecheck

            - name: Test
              run: pnpm test

            - name: Build
              run: pnpm build
